services:
  mongodb:
    image: mongo:7.0
    container_name: nursecalc-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nursecalc-dev-net

  server:
    image: node:20-alpine
    container_name: nursecalc-server-dev
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/nursecalc
      - JWT_SECRET=nursecalc_super_secret_jwt_key_2026
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nursecalc-dev-net

  client:
    image: node:20-alpine
    container_name: nursecalc-client-dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server
    networks:
      - nursecalc-dev-net

volumes:
  mongo_dev_data:
    driver: local

networks:
  nursecalc-dev-net:
    driver: bridge
